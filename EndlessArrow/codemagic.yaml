workflows:
  ios-workflow:
    name: EndlessArrow iOS Build

    working_directory: EndlessArrow

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Build iOS
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app