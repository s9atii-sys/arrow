workflows:
  ios-workflow:
    name: EndlessArrow iOS

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Find Flutter project
        script: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "Finding pubspec.yaml:"
          find . -maxdepth 4 -name pubspec.yaml -print
