workflows:
  ios-workflow:
    name: EndlessArrow iOS

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          cd "$CM_BUILD_DIR/EndlessArrow"
          flutter pub get

      - name: Build iOS
        script: |
          cd "$CM_BUILD_DIR/EndlessArrow"
          flutter build ios --release --no-codesign
