
workflows:
  ios-workflow:
    name: EndlessArrow iOS Build

    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Install Flutter dependencies
        script: |
          cd "$CM_BUILD_DIR/EndlessArrow"
          flutter pub get

      - name: Build iOS
        script: |
          cd "$CM_BUILD_DIR/EndlessArrow"
          flutter build ios --release --no-codesign

    artifacts:
      - EndlessArrow/build/ios/iphoneos/*.app
      - EndlessArrow/build/ios/**/*.dSYM
